# Builds the SvelteKit site and publishes it to this repository's GitHub Pages
# site, which serves www.teraustralis.com.au.
#
# This repository is private and the published site is public. That is a
# supported combination: only a *private* Pages site requires an Enterprise
# plan, and this one is public.
#
# Pages must serve the build output, not the repository root. Branch-based
# publishing cannot express that — it offers only / or /docs, and neither is
# vision/site/build — so the deployment is owned here instead. The first run of
# this workflow switches the Pages source to "GitHub Actions"; the custom
# domain setting is independent of the source and carries across unchanged.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build_and_publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd vision/site && npm install

      - name: Build
        run: cd vision/site && npm run build

      - name: Add static demo shells to the published site
        run: |
          cp -r vision/apps/crystal-interface vision/site/build/crystal-interface
          cp -r vision/apps/vision-web vision/site/build/vision-web

      # vision/site/static/CNAME is copied into the build by SvelteKit, so the
      # custom domain travels with the artifact as well as living in settings.
      - name: Confirm the custom domain travelled with the build
        run: |
          test -f vision/site/build/CNAME
          echo "CNAME: $(cat vision/site/build/CNAME)"

      # End the race at its source rather than surviving it.
      #
      # While Pages "Source" is set to "Deploy from a branch", GitHub runs its
      # own builder on every push to main. That builder renders the repository
      # root with Jekyll and finishes within a minute of this job, so which
      # version of the site survives is decided by scheduling luck. The
      # verification below has caught and repaired that twice, but repairing a
      # race every deploy is not the same as not having one.
      #
      # build_type: workflow is precisely what the Settings dropdown sets. Doing
      # it here makes the setting a property of the repository rather than
      # something that has to be remembered, and it is idempotent — once it
      # reads "workflow", this step does nothing.
      #
      # Deliberately non-fatal: if the token cannot change it, the deploy still
      # proceeds and the self-heal still covers us. It warns instead.
      - name: Ensure Pages is served by this workflow, not the branch builder
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)
          echo "Pages build_type before: $before"

          if [ "$before" = "workflow" ]; then
            echo "Already served by this workflow — nothing to change."
            exit 0
          fi

          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            after=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo unknown)
            echo "Pages build_type after: $after"
            [ "$after" = "workflow" ] && echo "Race eliminated: the branch builder will no longer be triggered."
          else
            echo "::warning::Could not change the Pages source with this token."
            echo "::warning::Set Settings -> Pages -> Source to 'GitHub Actions' by hand."
            echo "::warning::Until then every push is a race, repaired by the retry below."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: vision/site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # A successful deploy does not mean the site is being served. If the Pages
      # Source is set to "Deploy from a branch", GitHub also runs its own
      # builder on every push; that one renders the repository root with Jekyll
      # and finishes 20-45s after this job, overwriting the site with a rendered
      # README. Both jobs report success and the environment URL stays correct,
      # so the failure is completely silent.
      #
      # Wait past the other builder before checking, and assert a path that
      # exists only in the built site. Never assert the bare domain: it returns
      # 200 in the failure mode too, because the README renders at root.
      # continue-on-error so a self-heal below can still finish green; only the
      # final check decides the job's outcome.
      - name: Verify the domain is serving this build
        id: verify
        continue-on-error: true
        run: |
          echo "Waiting 90s for any competing Pages build to finish..."
          sleep 90
          "${GITHUB_WORKSPACE}/.github/scripts/probe-site.sh"

      # One bounded self-heal: re-deploy so our output lands after the other
      # builder. Bounded deliberately, so the two cannot fight indefinitely.
      #
      # The artifact must be uploaded again first. actions/deploy-pages consumes
      # the github-pages artifact when it deploys, so a second deploy in the
      # same job finds "Found 0 artifact(s)" and fails. The build output is
      # still on disk, so re-uploading it is cheap and makes the retry real —
      # without this the self-heal could never have worked.
      - name: Re-upload the built site for the retry
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: vision/site/build

      - name: Re-deploy over a competing build
        if: steps.verify.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Confirm the re-deploy took
        if: steps.verify.outcome == 'failure'
        run: |
          if "${GITHUB_WORKSPACE}/.github/scripts/probe-site.sh"; then
            echo "Serving this build after one re-deploy."
            exit 0
          fi
          echo "::error::The domain is not serving this build."
          echo "::error::Set Settings -> Pages -> Source to 'GitHub Actions'."
          echo "::error::While Source is 'Deploy from a branch', GitHub's own"
          echo "::error::builder publishes the repo README over this site."
          exit 1
