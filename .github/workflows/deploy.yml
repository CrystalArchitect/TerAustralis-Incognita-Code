name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd vision/site && npm install

      - name: Build
        run: cd vision/site && npm run build

      - name: Add static demo shells to the Pages artifact
        run: |
          cp -r vision/apps/crystal-interface vision/site/build/crystal-interface
          cp -r vision/apps/vision-web vision/site/build/vision-web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'vision/site/build'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
