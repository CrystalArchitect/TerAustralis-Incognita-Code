name: Publish site

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd vision/site && npm install

      - name: Build
        run: cd vision/site && npm run build

      - name: Add static demo shells to the published site
        run: |
          cp -r vision/apps/crystal-interface vision/site/build/crystal-interface
          cp -r vision/apps/vision-web vision/site/build/vision-web

      # Pages cannot serve from this repository — it is private, and Pages on a
      # private repo requires a paid plan. The built site is published to the
      # public TerAustralis-Incognita repo, which serves it at the custom domain.
      - name: Publish to the public site repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: CrystalArchitect/TerAustralis-Incognita
          publish_branch: gh-pages
          publish_dir: vision/site/build
          cname: www.teraustralis.com.au
